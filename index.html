
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Imagens dos Cultos</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 25px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    opacity: .75;
}

main {
    width: min(1100px, 94%);
    margin: 30px auto;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px #0001;
}

.login {
    max-width: 430px;
    margin: 70px auto;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    margin: 8px 0 14px;
    font-size: 16px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 13px 18px;
    background: #2563eb;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

button.danger {
    background: #dc2626;
}

button.danger:hover {
    background: #b91c1c;
}

button.gray {
    background: #4b5563;
}

.upload {
    border: 2px dashed #9ca3af;
    border-radius: 14px;
    padding: 35px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 15px;
}

.upload:hover {
    border-color: #2563eb;
    background: #f8fafc;
}

.upload input {
    display: none;
}

.hidden {
    display: none !important;
}

.status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #eef2ff;
}

.status.ok {
    background: #dcfce7;
    color: #166534;
}

.status.error {
    background: #fee2e2;
    color: #991b1b;
}

.files {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 18px;
}

.file {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    overflow: hidden;
    background: white;
}

.preview {
    height: 170px;
    background: #111827;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.video-icon {
    font-size: 55px;
}

.info {
    padding: 14px;
}

.name {
    font-weight: bold;
    word-break: break-word;
}

.date {
    color: #6b7280;
    font-size: 13px;
    margin-top: 7px;
}

.actions {
    display: flex;
    gap: 8px;
    margin-top: 13px;
}

.actions button {
    flex: 1;
    font-size: 13px;
}

.empty {
    padding: 35px;
    text-align: center;
    color: #6b7280;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.progress {
    width: 100%;
    height: 8px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
    display: none;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #2563eb;
    transition: width .2s;
}

@media (max-width: 600px) {
    .top {
        flex-direction: column;
        align-items: stretch;
    }
}
</style>
</head>

<body>

<header>
    <h1>📁 Imagens dos Cultos</h1>
    <p>Fotos e vídeos</p>
</header>

<main>

<!-- LOGIN -->

<section id="loginCard" class="card login">

    <h2>🔐 Entrar</h2>

    <p>Digite a senha para acessar os arquivos.</p>

    <input
        id="senha"
        type="password"
        placeholder="Senha"
        autocomplete="off"
    >

    <button
        id="loginButton"
        onclick="entrar()"
        style="width:100%;"
    >
        Entrar
    </button>

    <div id="loginStatus"></div>

</section>


<!-- PAINEL -->

<section id="painel" class="hidden">

    <!-- UPLOAD -->

    <div class="card">

        <h2>📤 Enviar foto ou vídeo</h2>

        <p>
            O arquivo será enviado diretamente para:
            <strong>Imagens_Cultos</strong>
        </p>

        <label class="upload">

            <input
                id="arquivo"
                type="file"
                accept="image/*,video/*"
                onchange="selecionarArquivo()"
            >

            <strong>📷 Clique para selecionar</strong>

            <div id="nomeArquivo">
                Nenhum arquivo selecionado
            </div>

        </label>

        <button
            id="uploadButton"
            onclick="enviar()"
        >
            ☁️ Enviar para o Drive
        </button>

        <div class="progress" id="progress">
            <div
                class="progress-bar"
                id="progressBar"
            ></div>
        </div>

        <div id="uploadStatus"></div>

    </div>


    <!-- ARQUIVOS -->

    <div class="card">

        <div class="top">

            <div>
                <h2>📂 Imagens_Cultos</h2>
                <span id="contador">
                    Carregando...
                </span>
            </div>

            <button
                class="gray"
                onclick="carregarArquivos()"
            >
                🔄 Atualizar
            </button>

        </div>

        <input
            id="pesquisa"
            type="text"
            placeholder="🔎 Pesquisar..."
            oninput="pesquisar()"
        >

        <div
            id="lista"
            class="files"
        >
            <div class="empty">
                Carregando...
            </div>
        </div>

    </div>

</section>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyPAu5P50M_jmXpzQOAsUgBrUT7nNXtFxRnTAFECzmch8_gIuP3y88TI-EF7sPx4SvM3Q/exec";


let senhaAtual = "";
let arquivosAtuais = [];


// ========================================
// LOGIN
// ========================================

async function entrar() {

    const senha =
        document.getElementById("senha").value.trim();

    const status =
        document.getElementById("loginStatus");

    if (!senha) {

        mostrarStatus(
            status,
            "Digite a senha.",
            false
        );

        return;
    }

    const botao =
        document.getElementById("loginButton");

    botao.disabled = true;
    botao.textContent = "Entrando...";

    try {

        const resposta =
            await api({
                acao: "login",
                senha: senha
            });

        if (!resposta.ok) {

            mostrarStatus(
                status,
                "Senha incorreta.",
                false
            );

            return;
        }

        senhaAtual = senha;

        document
            .getElementById("loginCard")
            .classList.add("hidden");

        document
            .getElementById("painel")
            .classList.remove("hidden");

        await carregarArquivos();

    } catch (erro) {

        console.error(erro);

        mostrarStatus(
            status,
            "Não foi possível conectar ao servidor.",
            false
        );

    } finally {

        botao.disabled = false;
        botao.textContent = "Entrar";
    }
}


// ========================================
// API
// ========================================

async function api(dados) {

    const resposta = await fetch(
        API_URL,
        {
            method: "POST",

            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },

            body: JSON.stringify(dados)
        }
    );

    if (!resposta.ok) {
        throw new Error(
            "HTTP " + resposta.status
        );
    }

    return await resposta.json();
}


// ========================================
// SELECIONAR
// ========================================

function selecionarArquivo() {

    const input =
        document.getElementById("arquivo");

    const nome =
        document.getElementById("nomeArquivo");

    if (!input.files.length) {

        nome.textContent =
            "Nenhum arquivo selecionado";

        return;
    }

    const arquivo =
        input.files[0];

    nome.textContent =
        arquivo.name +
        " — " +
        tamanho(arquivo.size);
}


// ========================================
// UPLOAD
// ========================================

async function enviar() {

    const input =
        document.getElementById("arquivo");

    const status =
        document.getElementById("uploadStatus");

    const botao =
        document.getElementById("uploadButton");

    if (!input.files.length) {

        mostrarStatus(
            status,
            "Selecione uma foto ou vídeo.",
            false
        );

        return;
    }

    const arquivo =
        input.files[0];

    botao.disabled = true;
    botao.textContent = "Enviando...";

    document
        .getElementById("progress")
        .style.display = "block";

    document
        .getElementById("progressBar")
        .style.width = "20%";

    try {

        mostrarStatus(
            status,
            "Preparando arquivo...",
            true
        );

        const base64 =
            await arquivoParaBase64(arquivo);

        document
            .getElementById("progressBar")
            .style.width = "60%";

        const resposta =
            await api({

                acao: "upload",

                senha: senhaAtual,

                nome: arquivo.name,

                mimeType: arquivo.type,

                base64: base64
            });

        if (!resposta.ok) {

            throw new Error(
                resposta.erro || "Falha no upload"
            );
        }

        document
            .getElementById("progressBar")
            .style.width = "100%";

        mostrarStatus(
            status,
            "✅ Arquivo enviado para Imagens_Cultos!",
            true
        );

        input.value = "";

        document
            .getElementById("nomeArquivo")
            .textContent =
            "Nenhum arquivo selecionado";

        await carregarArquivos();

    } catch (erro) {

        console.error(erro);

        mostrarStatus(
            status,
            "❌ Erro: " + erro.message,
            false
        );

    } finally {

        botao.disabled = false;
        botao.textContent = "☁️ Enviar para o Drive";

        setTimeout(() => {

            document
                .getElementById("progress")
                .style.display = "none";

        }, 800);
    }
}


// ========================================
// CONVERTER ARQUIVO
// ========================================

function arquivoParaBase64(arquivo) {

    return new Promise(
        (resolve, reject) => {

            const leitor =
                new FileReader();

            leitor.onload = () => {

                const resultado =
                    leitor.result;

                const base64 =
                    resultado.split(",")[1];

                resolve(base64);
            };

            leitor.onerror =
                reject;

            leitor.readAsDataURL(arquivo);
        }
    );
}


// ========================================
// LISTAR
// ========================================

async function carregarArquivos() {

    const lista =
        document.getElementById("lista");

    lista.innerHTML = `
        <div class="empty">
            🔄 Carregando arquivos...
        </div>
    `;

    try {

        const resposta =
            await api({

                acao: "listar",

                senha: senhaAtual
            });

        if (!resposta.ok) {

            throw new Error(
                resposta.erro
            );
        }

        arquivosAtuais =
            resposta.arquivos || [];

        renderizarArquivos(
            arquivosAtuais
        );

    } catch (erro) {

        console.error(erro);

        lista.innerHTML = `
            <div class="empty">
                ❌ Não foi possível carregar os arquivos.
                <br><br>
                ${erro.message}
            </div>
        `;
    }
}


// ========================================
// RENDER
// ========================================

function renderizarArquivos(arquivos) {

    const lista =
        document.getElementById("lista");

    const contador =
        document.getElementById("contador");

    contador.textContent =
        `${arquivos.length} arquivo(s)`;

    if (!arquivos.length) {

        lista.innerHTML = `
            <div class="empty">
                📂 A pasta Imagens_Cultos está vazia.
            </div>
        `;

        return;
    }

    lista.innerHTML = "";

    arquivos.forEach(arquivo => {

        const item =
            document.createElement("div");

        item.className = "file";

        const ehImagem =
            arquivo.tipo === "imagem";

        item.innerHTML = `

            <div class="preview">

                ${
                    ehImagem
                    ?
                    `
                    <div style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        font-size:50px;
                    ">
                        🖼️
                    </div>
                    `
                    :
                    `
                    <div class="video-icon">
                        🎥
                    </div>
                    `
                }

            </div>

            <div class="info">

                <div class="name">
                    ${escapar(arquivo.nome)}
                </div>

                <div class="date">
                    ${formatarData(arquivo.data)}
                </div>

                <div class="actions">

                    <button
                        onclick="abrirArquivo('${arquivo.id}')"
                    >
                        Abrir
                    </button>

                    <button
                        class="danger"
                        onclick="excluir('${arquivo.id}')"
                    >
                        Excluir
                    </button>

                </div>

            </div>
        `;

        lista.appendChild(item);
    });
}


// ========================================
// ABRIR
// ========================================

function abrirArquivo(id) {

    const arquivo =
        arquivosAtuais.find(
            x => x.id === id
        );

    if (!arquivo) {
        return;
    }

    window.open(
        arquivo.url,
        "_blank"
    );
}


// ========================================
// EXCLUIR
// ========================================

async function excluir(id) {

    const arquivo =
        arquivosAtuais.find(
            x => x.id === id
        );

    if (!arquivo) {
        return;
    }

    const confirmar =
        confirm(
            `Excluir "${arquivo.nome}" do Google Drive?`
        );

    if (!confirmar) {
        return;
    }

    try {

        const resposta =
            await api({

                acao: "excluir",

                senha: senhaAtual,

                id: id
            });

        if (!resposta.ok) {

            throw new Error(
                resposta.erro
            );
        }

        await carregarArquivos();

    } catch (erro) {

        alert(
            "Erro ao excluir: " +
            erro.message
        );
    }
}


// ========================================
// PESQUISA
// ========================================

function pesquisar() {

    const termo =
        document
            .getElementById("pesquisa")
            .value
            .toLowerCase();

    const filtrados =
        arquivosAtuais.filter(
            arquivo =>
                arquivo.nome
                    .toLowerCase()
                    .includes(termo)
        );

    renderizarArquivos(
        filtrados
    );
}


// ========================================
// UTILITÁRIOS
// ========================================

function mostrarStatus(
    elemento,
    mensagem,
    sucesso
) {

    elemento.innerHTML =
        `<div class="status ${sucesso ? "ok" : "error"}">
            ${escapar(mensagem)}
        </div>`;
}


function tamanho(bytes) {

    if (bytes < 1024)
        return bytes + " B";

    if (bytes < 1024 * 1024)
        return (bytes / 1024).toFixed(1) + " KB";

    if (bytes < 1024 * 1024 * 1024)
        return (bytes / 1024 / 1024).toFixed(1) + " MB";

    return (bytes / 1024 / 1024 / 1024).toFixed(1) + " GB";
}


function formatarData(data) {

    if (!data) {
        return "";
    }

    return new Date(data)
        .toLocaleString("pt-BR");
}


function escapar(texto) {

    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
